name: himti-election-frontend

services:
  app:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:3002}
        VITE_REGISTRATION_APP_URL: ${VITE_REGISTRATION_APP_URL:-http://localhost:3001}
    image: himti-election-frontend:local
    container_name: himti-election-frontend
    ports:
      - "${FRONTEND_PORT:-3002}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
